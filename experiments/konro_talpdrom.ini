# DROM policy driven by the TALP metrics
[policy]
policy = TalpDromPolicy

[policytimer]
timerseconds = 2

[platformmonitor]
monitorperiod = 2

[talp]
# efficiency = useful CPUs (from TALP) / assigned CPUs
lowefficiency = 0.6
highefficiency = 0.8
# timer periods without growth after a CPU has been removed
backoffperiods = 5
